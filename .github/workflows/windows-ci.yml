name: Windows CI

on:
  push:
    branches:
      - master
  pull_request:
  release:
    types:
      - published

jobs:
  check-and-test:
    if: ${{ github.event_name != 'release' }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo check (all targets)
        run: cargo check --workspace --all-targets

      - name: Cargo check (examples)
        if: ${{ always() }}
        run: cargo check --workspace --examples

      - name: Cargo fmt (check)
        if: ${{ always() }}
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        if: ${{ always() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        if: ${{ always() }}
        run: cargo test --workspace --all-targets

      - name: Cargo publish (dry run)
        if: ${{ always() }}
        run: cargo publish --dry-run

  msrv:
    if: ${{ github.event_name != 'release' }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Keep this version in sync with 'rust-version' in Cargo.toml.
      # Only the library is checked here, since some dev-dependencies
      # require a newer compiler than the library itself.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85

      - name: Cargo check (library only)
        run: cargo check --lib

  publish:
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
