[package]
name = "wasapi"
version = "0.27.0"
edition = "2024"
rust-version = "1.95"
authors = ["HEnquist <henrik.enquist@gmail.com>"]
description = "Bindings for the Wasapi API on Windows"
license = "MIT"
repository = "https://github.com/HEnquist/wasapi-rs"
keywords = ["audio", "sound", "windows", "wasapi"]
categories = ["multimedia::audio", "os::windows-apis"]
readme = "README.md"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Enables the device backed test suite in tests/device/. It needs a virtual
# audio cable to be installed, see .github/workflows/device-tests.yml.
# Not needed to use the crate.
device-tests = []

# Needs a real audio device, so it is not built or run by a plain `cargo test`.
# Run it with `cargo test --features device-tests --test device`.
# The root is main.rs so that `mod support` and the rest resolve inside
# tests/device/, which they would not do if the root were tests/device.rs.
[[test]]
name = "device"
path = "tests/device/main.rs"
required-features = ["device-tests"]

[dependencies]
log = "0.4"
num-integer = "0.1"
# The Windows API bindings are generated into src/bindings/generated.rs, see tools/bindings.
windows-core = "0.100.0"
thiserror = "2.0"

[dev-dependencies]
# Only SimpleLogger is used, so the termcolor feature for TermLogger is left out.
simplelog = { version = "0.12", default-features = false, features = ["local-offset"] }
rand = "0.10"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]
